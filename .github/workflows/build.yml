name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build program (PyInstaller)
        run: pyinstaller --noconfirm --windowed --name MP4Cutter --collect-all imageio_ffmpeg mp4_cutter.py

      - name: Make portable zip
        run: Compress-Archive -Path dist\MP4Cutter -DestinationPath MP4Cutter_portable.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: MP4Cutter_Setup
          path: installer_output/MP4Cutter_Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MP4Cutter_portable
          path: MP4Cutter_portable.zip
